<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="column-md-8">
          <!-- Header -->
          <div class="d-flex flex-column align-items-center">
            <div class="d-flex flex-row align-items-center gap-2">
              <i class="bi bi-shield-slash-fill fs-2 text-success"></i>
              <div class="fs-2 fw-bold">AnimoGuard</div>
            </div>

            <div class="text-secondary mt-1">
              Create a password for your DLSU account
            </div>
          </div>

          <!-- Form Card -->
          <div class="form-card card mt-5">
            <div class="card-body p-4">
              <form>
                <div class="text-start mb-4">
                  <label for="id_num" class="form-label fw-semibold"
                    >ID Number (Username)</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-person"></i
                    ></span>
                    <input
                      class="bg-light form-control"
                      name="id_num"
                      placeholder="12XXXXXX"
                      autocomplete="off"
                      required
                      autofocus
                    />
                  </div>
                </div>
                <div class="text-start mb-4">
                  <label for="base_string" class="form-label fw-semibold"
                    >Base Passphrase</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-lock"></i
                    ></span>
                    <input
                      class="bg-light form-control"
                      name="base_string"
                      placeholder="Enter your passphrase"
                      autocomplete="off"
                      required
                    />
                  </div>
                </div>
                <button
                  class="btn btn-success w-100 d-flex justify-content-center"
                  type="submit"
                >
                  Create password<span class="ms-2"
                    ><i class="bi bi-arrow-right-circle"></i
                  ></span>
                </button>
              </form>
            </div>
          </div>

          <!-- Result Card -->
          <div class="result-card card mt-5"></div>
        </div>
      </div>
    </div>
  </body>
</html>
